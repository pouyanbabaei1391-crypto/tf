name: Build NexaDrop APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    name: Android release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          sdkmanager --version

      - name: Generate Android runner and resolve packages
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap_android.sh

      - name: Analyze Dart source (diagnostic only)
        continue-on-error: true
        shell: bash
        run: flutter analyze --no-fatal-infos

      - name: Run protocol tests (diagnostic only)
        continue-on-error: true
        shell: bash
        run: flutter test

      # The actual gate is the release build: a real compile/Android error still fails here.
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" NexaDrop-v0.1.3.apk
          sha256sum NexaDrop-v0.1.3.apk > NexaDrop-v0.1.3.apk.sha256
          ls -lh NexaDrop-v0.1.3.apk NexaDrop-v0.1.3.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: NexaDrop-Android-APK-v0.1.3
          path: |
            NexaDrop-v0.1.3.apk
            NexaDrop-v0.1.3.apk.sha256
          if-no-files-found: error
          retention-days: 30
